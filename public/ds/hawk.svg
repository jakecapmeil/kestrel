<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Source sprite. Browsers do not render <use href="/ds/hawk.svg#id"> across files here: paste the symbols inline, or use /kestrel.svg in an <img>. -->
  <!-- hawk: the original mark (first Kestrel commit, fced8dc), unchanged shape. currentColor; the eye reads --hawk-eye. -->
  <symbol id="hawk" viewBox="0 0 32 32"><path fill="currentColor" d="M5 17c4-1 7-4 9-8 1 3 3 5 6 5l7-3c-2 4-5 6-9 7l-3 6-2-5c-3 0-6-1-8-2z"/><circle cx="20.5" cy="12.6" r="1.1" fill="var(--hawk-eye,#e1371a)"/></symbol>
  <!-- hawk-outline: same shape, stroke only. -->
  <symbol id="hawk-outline" viewBox="0 0 32 32"><path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" d="M5 17c4-1 7-4 9-8 1 3 3 5 6 5l7-3c-2 4-5 6-9 7l-3 6-2-5c-3 0-6-1-8-2z"/><circle cx="20.5" cy="12.6" r="1.1" fill="var(--hawk-eye,#e1371a)"/></symbol>
  <!-- hawk-tile: the app mark, ink tile with the outline hawk. Fixed colours, for avatars, icons and the favicon. -->
  <symbol id="hawk-tile" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#0d0d0f"/><path fill="none" stroke="#f5f2ea" stroke-width="1.4" stroke-linejoin="round" d="M5 17c4-1 7-4 9-8 1 3 3 5 6 5l7-3c-2 4-5 6-9 7l-3 6-2-5c-3 0-6-1-8-2z"/><circle cx="20.5" cy="12.6" r="1.1" fill="#e1371a"/></symbol>
</svg>
