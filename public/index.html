<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Kestrel</title>
<meta name="description" content="Kestrel: open-source training for school running teams. Team calendar, training log, open-weight race-time models and an AI coach you power with any model.">
<link rel="icon" href="/kestrel.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter+Tight:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<!-- #rough gives icons and avatars a slightly uneven, hand-drawn edge. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
  </filter>
</svg>

<header class="top">
  <a class="brand" href="#team"><img src="/kestrel.svg" alt="" width="26" height="26"><span>Kestrel</span></a>
  <button class="who" id="who" hidden></button>
</header>

<main id="app"><p class="muted pad">Loading…</p></main>

<nav class="tabs" id="tabs" hidden>
  <a href="#team" data-tab="team"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>Team</a>
  <a href="#training" data-tab="training"><svg viewBox="0 0 24 24"><path d="M4 20V11M9.5 20V6M15 20v-9M20.5 20V4"/></svg>Training</a>
  <a href="#races" data-tab="races"><svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7"/><path d="M12 13.5V9.5M10 3h4M18.5 7l1.3-1.3"/></svg>Races</a>
  <a href="#models" data-tab="models"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>Models</a>
  <a href="#coach" data-tab="coach"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H10l-5 4v-4H4z"/></svg>Coach</a>
</nav>

<div class="toast" id="toast" role="status" hidden></div>
<script type="module" src="/app.js"></script>
</body>
</html>
